services:
  report-api:
    build: .
    container_name: cross-border-report-api
    restart: unless-stopped
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "8000:8000"
    volumes:
      - D:/cross_border_daily_report/data:/data:ro

  dashboard:
    build: .
    container_name: cross-border-report-dashboard
    restart: unless-stopped
    command: streamlit run app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    depends_on:
      report-api:
        condition: service_healthy

  n8n:
    image: docker.n8n.io/n8nio/n8n:1.123.5
    container_name: cross-border-report-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_SECURE_COOKIE=false
      - TZ=Asia/Shanghai
    volumes:
      - D:/cross_border_daily_report/n8n_data:/home/node/.n8n
      - D:/cross_border_daily_report/data:/data:ro
    depends_on:
      report-api:
        condition: service_healthy
